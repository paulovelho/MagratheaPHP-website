    <meta charset="utf-8" />
    <script>
      (function() {
        try {
          var _fetch = window.fetch ? window.fetch.bind(window) : undefined;
          var propConfig = {
            configurable: true,
            enumerable: true,
            get: function() { return _fetch; },
            set: function(val) { _fetch = val; }
          };
          try {
            Object.defineProperty(window, 'fetch', propConfig);
          } catch (e) {
            if (Object.getPrototypeOf(window)) {
              try {
                Object.defineProperty(Object.getPrototypeOf(window), 'fetch', propConfig);
              } catch (e2) {}
            }
          }
        } catch (e) {}
      })();
    </script>
